name: ClassMode Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: cd android && chmod +x gradlew

      - name: Run Domain Unit Tests
        run: cd android && ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK (Verification)
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload Debug Build Artifact
        uses: actions/upload-artifact@v3
        with:
          name: classmode-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release_build:
    name: Generate Release Build
    needs: build_and_test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Build Release App Bundle (AAB)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease --no-daemon

      - name: Upload Release AAB Artifact
        uses: actions/upload-artifact@v3
        with:
          name: classmode-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
